# call plans for the 17 development templates, written from the task text alone.
# label.py turns each plan into an answer key; it should equal the development key (checks the labeler, not the generator).
bc1-read:
  - {name: github.issues.get, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number}"}}
bc1-read-label:
  - {name: github.issues.get, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number}"}}
  - {name: github.issues.add_labels, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number}"}}
bc1-read-two:
  - {name: github.issues.get, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number}"}}
  - {name: github.issues.get, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number2}"}}
bc1-label-second:
  - {name: github.issues.get, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number}"}}
  - {name: github.issues.get, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number2}"}}
  - {name: github.issues.add_labels, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number2}"}}
bc1-label-only:
  - {name: github.issues.add_labels, with: {owner: "{owner}", repo: "{repo}", number: "{issue_number}"}}
bc2-test:
  - {name: fs.read, with: {volume: /workspace/src}}
bc2-build:
  - {name: fs.read, with: {volume: /workspace/src}}
  - {name: fs.write, with: {volume: /artifacts}}
  - {name: s3.put_object, with: {bucket: "{owner}-builds", key: "{prefix}/{artifact}"}}
bc2-lint:
  - {name: fs.read, with: {volume: /workspace/src}}
bc2-build-test:
  - {name: fs.read, with: {volume: /workspace/src}}
  - {name: fs.write, with: {volume: /artifacts}}
  - {name: s3.put_object, with: {bucket: "{owner}-builds", key: "{prefix}/{artifact}"}}
bc2-deploy-one:
  - {name: s3.copy_object, with: {source_bucket: "{owner}-builds", source_key: "{prefix}/{artifact}", bucket: "{owner}-staging", key: "{prefix}/{artifact}"}}
bc2-deploy-two:
  - {name: s3.copy_object, with: {source_bucket: "{owner}-builds", source_key: "{prefix}/{artifact}", bucket: "{owner}-staging", key: "{prefix}/{artifact}"}}
  - {name: s3.copy_object, with: {source_bucket: "{owner}-builds", source_key: "{prefix}/{artifact2}", bucket: "{owner}-staging", key: "{prefix}/{artifact2}"}}
bc2-deploy-verify:
  - {name: s3.copy_object, with: {source_bucket: "{owner}-builds", source_key: "{prefix}/{artifact}", bucket: "{owner}-staging", key: "{prefix}/{artifact}"}}
  - {name: s3.get_object, with: {bucket: "{owner}-staging", key: "{prefix}/{artifact}"}}
bc3-read-one:
  - {name: docs.documents.get, with: {doc: "{doc}"}}
bc3-read-two:
  - {name: docs.documents.get, with: {doc: "{doc}"}}
  - {name: docs.documents.get, with: {doc: "{doc2}"}}
bc3-extract:
  - {name: docs.documents.get, with: {doc: "{doc}"}}
bc3-post-one:
  - {name: slack.chat.post_message, with: {channel_id: "{channel_id}"}}
bc3-post-two:
  - {name: slack.chat.post_message, with: {channel_id: "{channel_id}"}}
  - {name: slack.chat.post_message, with: {channel_id: "{channel2_id}"}}
