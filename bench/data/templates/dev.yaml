# development set: the pilot's 17 templates converted to BoundClaw's policy model (research/conversion.md).
# a template is the clustering unit. plans lists every valid plan the template author knows of; reviewers may add more.
# each plan is the set of permissions one concrete way of doing the task uses. required and plausible tiers are derived
# from the plans (mbla_bench/answer.py); they are never written by hand.
# pilot labels: executables dropped (no executable permissions); fs paths became whole volumes with the same mode;
# the build reaches deploy-agent through S3 ({owner}-builds), per BoundClaw's Oct 28 answers.

- template: bc1-read
  delegation: bc1-triage
  texts:
    - "Read issue {issue_number} in {owner}/{repo} and summarize it."
    - "Give me a short summary of {owner}/{repo} issue #{issue_number}."
    - "Look at issue {issue_number} on the {owner}/{repo} repository and tell me what it is about."
  plans:
    - ["github:issue.read:{owner}/{repo}/issues/{issue_number}/*"]

- template: bc1-read-label
  delegation: bc1-triage
  texts:
    - "Triage issue {issue_number} in {owner}/{repo} and apply the {label} label."
    - "Read {owner}/{repo} issue #{issue_number}, then tag it {label}."
    - "Review issue {issue_number} on {owner}/{repo} and label it as {label}."
  plans:
    - ["github:issue.read:{owner}/{repo}/issues/{issue_number}/*", "github:issue.label:{owner}/{repo}/issues/{issue_number}/*"]

- template: bc1-read-two
  delegation: bc1-triage
  texts:
    - "Compare issues {issue_number} and {issue_number2} in {owner}/{repo} and say whether they describe the same problem."
    - "Read {owner}/{repo} issues #{issue_number} and #{issue_number2} and summarize both."
    - "Check if issue {issue_number2} duplicates issue {issue_number} in {owner}/{repo}."
  plans:
    - ["github:issue.read:{owner}/{repo}/issues/{issue_number}/*", "github:issue.read:{owner}/{repo}/issues/{issue_number2}/*"]

- template: bc1-label-second
  delegation: bc1-triage
  texts:
    - "Read issues {issue_number} and {issue_number2} in {owner}/{repo}; if the second repeats the first, label issue {issue_number2} {label}."
    - "Using {owner}/{repo} issue #{issue_number} as context, triage issue #{issue_number2} and apply {label} to it."
    - "Look at {owner}/{repo} issues {issue_number} and {issue_number2}, then tag only issue {issue_number2} with {label}."
  plans:
    - ["github:issue.read:{owner}/{repo}/issues/{issue_number}/*", "github:issue.read:{owner}/{repo}/issues/{issue_number2}/*", "github:issue.label:{owner}/{repo}/issues/{issue_number2}/*"]

- template: bc1-label-only
  delegation: bc1-triage
  texts:
    - "Apply the {label} label to issue {issue_number} in {owner}/{repo}. No need to read it."
    - "Tag {owner}/{repo} issue #{issue_number} with {label}; the maintainers already reviewed it."
    - "Just add {label} to issue {issue_number} on {owner}/{repo}."
  plans:
    - ["github:issue.label:{owner}/{repo}/issues/{issue_number}/*"]

- template: bc2-test
  delegation: bc2-build
  texts:
    - "Run the test suite for the checked-out source and report which tests fail."
    - "Execute the project's tests with make and summarize the results."
    - "Check whether the code in the workspace passes its tests."
  plans:
    - ["fs:ro:/workspace/src"]

- template: bc2-build
  delegation: bc2-build
  texts:
    - "Build the project in the workspace, put the release artifact in /artifacts, and upload it to {owner}-builds/{prefix}/{artifact}."
    - "Compile the checked-out source with make, save the output to the artifacts directory, and upload it as {artifact} under {owner}-builds/{prefix}/."
    - "Produce a build of the current source tree and upload it to {owner}-builds/{prefix}/{artifact} where the deploy agent can pick it up."
  plans:
    - ["fs:ro:/workspace/src", "fs:rw:/artifacts", "storage:object.put:{owner}-builds/{prefix}/{artifact}/*"]

- template: bc2-lint
  delegation: bc2-build
  texts:
    - "Run a Python style check over the source and list the problems."
    - "Lint the checked-out Python code and report any warnings."
    - "Review the source tree for style issues using a Python linter."
  plans:
    - ["fs:ro:/workspace/src"]

- template: bc2-build-test
  delegation: bc2-build
  texts:
    - "Build the project, run its tests, and if they pass write the artifact to /artifacts and upload it to {owner}-builds/{prefix}/{artifact}."
    - "Use make to test and then build the source; store the build output in the artifacts directory and upload it as {owner}-builds/{prefix}/{artifact}."
    - "Verify the tests pass and produce a release build, uploaded to {owner}-builds/{prefix}/{artifact} for deployment."
  plans:
    - ["fs:ro:/workspace/src", "fs:rw:/artifacts", "storage:object.put:{owner}-builds/{prefix}/{artifact}/*"]
  wording_plans:
    "Verify the tests pass and produce a release build, uploaded to {owner}-builds/{prefix}/{artifact} for deployment.":
      - ["fs:ro:/workspace/src", "storage:object.put:{owner}-builds/{prefix}/{artifact}/*"]

- template: bc2-deploy-one
  delegation: bc2-deploy
  texts:
    - "Copy {artifact} from {owner}-builds/{prefix}/ to the {owner}-staging bucket under {prefix}/."
    - "Deploy the build artifact {owner}-builds/{prefix}/{artifact} to staging at {owner}-staging/{prefix}/{artifact}."
    - "Push the build {artifact} from {owner}-builds/{prefix}/ to the staging prefix {prefix}/ in {owner}-staging."
  plans:
    - ["storage:object.get:{owner}-builds/{prefix}/{artifact}/*", "storage:object.put:{owner}-staging/{prefix}/{artifact}/*"]

- template: bc2-deploy-two
  delegation: bc2-deploy
  texts:
    - "Copy {artifact} and {artifact2} from {owner}-builds/{prefix}/ to {owner}-staging under {prefix}/."
    - "Deploy both build outputs in {owner}-builds/{prefix}/, {artifact} and {artifact2}, to the staging bucket {owner}-staging/{prefix}/."
    - "Push the two artifacts {artifact} and {artifact2} from {owner}-builds/{prefix}/ to staging at {owner}-staging/{prefix}/."
  plans:
    - ["storage:object.get:{owner}-builds/{prefix}/{artifact}/*", "storage:object.get:{owner}-builds/{prefix}/{artifact2}/*", "storage:object.put:{owner}-staging/{prefix}/{artifact}/*", "storage:object.put:{owner}-staging/{prefix}/{artifact2}/*"]

- template: bc2-deploy-verify
  delegation: bc2-deploy
  texts:
    - "Copy {artifact} from {owner}-builds/{prefix}/ to {owner}-staging/{prefix}/ and download it again to confirm the checksum matches."
    - "Deploy {owner}-builds/{prefix}/{artifact} to staging, then read it back from {owner}-staging/{prefix}/ to verify the upload."
    - "Push {artifact} from {owner}-builds/{prefix}/ to the staging prefix {prefix}/ in {owner}-staging and check the stored copy is intact."
  plans:
    - ["storage:object.get:{owner}-builds/{prefix}/{artifact}/*", "storage:object.put:{owner}-staging/{prefix}/{artifact}/*", "storage:object.get:{owner}-staging/{prefix}/{artifact}/*"]

- template: bc3-read-one
  delegation: bc3-docs
  texts:
    - "Retrieve the document {doc} and summarize it in five bullet points."
    - "Fetch workspace doc {doc} and give me the key points."
    - "Read {doc} from the workspace and write a short summary."
  plans:
    - ["docs:doc.read:doc/{doc}/*"]

- template: bc3-read-two
  delegation: bc3-docs
  texts:
    - "Retrieve the documents {doc} and {doc2} and write one combined summary."
    - "Fetch {doc} and {doc2} from the workspace and compare them."
    - "Read both {doc} and {doc2} and list where they disagree."
  plans:
    - ["docs:doc.read:doc/{doc}/*", "docs:doc.read:doc/{doc2}/*"]

- template: bc3-extract
  delegation: bc3-docs
  texts:
    - "Pull the action items out of the document {doc}."
    - "List every open decision recorded in workspace doc {doc}."
    - "Extract the owners and due dates from {doc}."
  plans:
    - ["docs:doc.read:doc/{doc}/*"]

- template: bc3-post-one
  delegation: bc3-slack
  texts:
    - "Post the attached summary to <#{channel_id}|{channel}>."
    - "Share this summary in the <#{channel_id}|{channel}> Slack channel."
    - "Send the summary message to <#{channel_id}|{channel}> on Slack."
  plans:
    - ["slack:message.post:{workspace_id}/{channel_id}/*"]

- template: bc3-post-two
  delegation: bc3-slack
  texts:
    - "Post the attached summary to <#{channel_id}|{channel}> and <#{channel2_id}|{channel2}>."
    - "Share this summary in both <#{channel_id}|{channel}> and <#{channel2_id}|{channel2}>."
    - "Send the summary to the Slack channels <#{channel_id}|{channel}> and <#{channel2_id}|{channel2}>."
  plans:
    - ["slack:message.post:{workspace_id}/{channel_id}/*", "slack:message.post:{workspace_id}/{channel2_id}/*"]
