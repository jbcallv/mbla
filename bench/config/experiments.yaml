# experiments of the final methodology (research/final_methodology.md). helper list: §4; data uses: §5 table.
# the pilot's experiments (other sizes, Laya, CLM, input ablations) are in git history before D-30.
mbla: ../mbla/bin/mbla
# no permission descriptions in the prompt: BoundClaw's adapter sends bare permission strings (D-33).
# FORTIS keeps its catalog's descriptions, which are part of that benchmark.
hardware: "1x NVIDIA L40S 46GB per model, exclusive (gpt-oss-120b, qwen3-30b: 2x)"
warmup: 5

items:
  dev: data/tasks/dev.jsonl
  test: data/tasks/test.jsonl

prompted: &prompted [set-only, manifest-only, lexical, random-25, random-50, random-75, capmas, capmas-scores,
                     qwen3-reranker-0.6b, qwen3-reranker-8b, qwen3-1.7b, qwen3-4b, qwen3-8b, qwen3-30b, gpt-oss-120b]

experiments:
  dev:
    purpose: "development set: scorer cutoffs (make tune), choosing the best helper, checking the pipeline"
    split: dev
    inputs: [full]
    methods: *prompted

  dev-tuned:
    purpose: "fine-tuned helpers on the development set, a read only: nothing is chosen from it except scorer cutoffs (D-55)"
    split: dev
    inputs: [full]
    methods: [qwen3-1.7b-tuned-s0, qwen3-1.7b-tuned-s1, qwen3-1.7b-tuned-s2, qwen3-4b-tuned-s0, qwen3-4b-tuned-s1, qwen3-4b-tuned-s2, qwen3-reranker-0.6b-tuned-s0, qwen3-reranker-0.6b-tuned-s1, qwen3-reranker-0.6b-tuned-s2, qwen3-8b-tuned-s0, qwen3-8b-tuned-s1, qwen3-8b-tuned-s2, qwen3-reranker-8b-tuned-s0, qwen3-reranker-8b-tuned-s1, qwen3-reranker-8b-tuned-s2]

  dev-capmas-retrained:
    purpose: "CAPMAS retrained on synthetic data, development set: scorer cutoffs only (D-63)"
    split: dev
    inputs: [full]
    methods: [capmas-retrained-bge-large-s0, capmas-retrained-bge-large-s1, capmas-retrained-bge-large-s2, capmas-retrained-qwen3-embedding-0.6b-s0, capmas-retrained-qwen3-embedding-0.6b-s1, capmas-retrained-qwen3-embedding-0.6b-s2]

  final:
    purpose: "final test set, run once after freezing (RQ1-RQ4; attacks (a) planted and (b) held-out styles)"
    split: test
    inputs: [full]
    methods: *prompted

  final-tuned:
    purpose: "fine-tuned helpers on the final test set (RQ5), run once; cutoffs from dev-tuned (D-58)"
    split: test
    inputs: [full]
    methods: [qwen3-1.7b-tuned-s0, qwen3-1.7b-tuned-s1, qwen3-1.7b-tuned-s2, qwen3-4b-tuned-s0, qwen3-4b-tuned-s1, qwen3-4b-tuned-s2, qwen3-reranker-0.6b-tuned-s0, qwen3-reranker-0.6b-tuned-s1, qwen3-reranker-0.6b-tuned-s2, qwen3-8b-tuned-s0, qwen3-8b-tuned-s1, qwen3-8b-tuned-s2, qwen3-reranker-8b-tuned-s0, qwen3-reranker-8b-tuned-s1, qwen3-reranker-8b-tuned-s2]

  final-tuned-manifest:
    purpose: "attack (d) on the final test set for the fine-tuned helpers (D-58)"
    items: data/attacks/test_manifest.jsonl
    inputs: [full]
    methods: [qwen3-1.7b-tuned-s0, qwen3-1.7b-tuned-s1, qwen3-1.7b-tuned-s2, qwen3-4b-tuned-s0, qwen3-4b-tuned-s1, qwen3-4b-tuned-s2, qwen3-reranker-0.6b-tuned-s0, qwen3-reranker-0.6b-tuned-s1, qwen3-reranker-0.6b-tuned-s2, qwen3-8b-tuned-s0, qwen3-8b-tuned-s1, qwen3-8b-tuned-s2, qwen3-reranker-8b-tuned-s0, qwen3-reranker-8b-tuned-s1, qwen3-reranker-8b-tuned-s2]

  heldout:
    purpose: "synthetic held-out families (RQ5): fine-tuned helpers and their prompted versions, never seen in training (D-58)"
    items: data/tasks/synth_heldout.jsonl
    inputs: [full]
    methods: [qwen3-reranker-0.6b, qwen3-reranker-8b, qwen3-1.7b, qwen3-4b, qwen3-8b, qwen3-1.7b-tuned-s0, qwen3-1.7b-tuned-s1, qwen3-1.7b-tuned-s2, qwen3-4b-tuned-s0, qwen3-4b-tuned-s1, qwen3-4b-tuned-s2, qwen3-reranker-0.6b-tuned-s0, qwen3-reranker-0.6b-tuned-s1, qwen3-reranker-0.6b-tuned-s2, qwen3-8b-tuned-s0, qwen3-8b-tuned-s1, qwen3-8b-tuned-s2, qwen3-reranker-8b-tuned-s0, qwen3-reranker-8b-tuned-s1, qwen3-reranker-8b-tuned-s2]

  dev-manifest:
    purpose: "attack (d) on the development set: the operator's signed manifest lists the attack's target (make attack-data)"
    items: data/attacks/dev_manifest.jsonl
    inputs: [full]
    methods: *prompted

  final-manifest:
    purpose: "attack (d) on the final test set, run once after freezing; derived deterministically from the frozen tasks"
    items: data/attacks/test_manifest.jsonl
    inputs: [full]
    methods: *prompted

  dev-adaptive:
    purpose: "attack (c) on the development set: texts searched against prompted Qwen3-4B, the D-54 pick, at each query budget (D-62)"
    items: data/attacks/dev_adaptive_qwen3-4b.jsonl
    inputs: [full]
    methods: [qwen3-4b]

  final-capmas-retrained:
    purpose: "CAPMAS retrained on synthetic data, final test set, run once; cutoffs from dev-capmas-retrained (D-63)"
    split: test
    inputs: [full]
    methods: [capmas-retrained-bge-large-s0, capmas-retrained-bge-large-s1, capmas-retrained-bge-large-s2, capmas-retrained-qwen3-embedding-0.6b-s0, capmas-retrained-qwen3-embedding-0.6b-s1, capmas-retrained-qwen3-embedding-0.6b-s2]

  final-capmas-retrained-manifest:
    purpose: "attack (d) on retrained CAPMAS, final test set (D-63)"
    items: data/attacks/test_manifest.jsonl
    inputs: [full]
    methods: [capmas-retrained-bge-large-s0, capmas-retrained-bge-large-s1, capmas-retrained-bge-large-s2, capmas-retrained-qwen3-embedding-0.6b-s0, capmas-retrained-qwen3-embedding-0.6b-s1, capmas-retrained-qwen3-embedding-0.6b-s2]

  heldout-capmas-retrained:
    purpose: "CAPMAS retrained, synthetic held-out families (D-63)"
    items: data/tasks/synth_heldout.jsonl
    inputs: [full]
    methods: [capmas-retrained-bge-large-s0, capmas-retrained-bge-large-s1, capmas-retrained-bge-large-s2, capmas-retrained-qwen3-embedding-0.6b-s0, capmas-retrained-qwen3-embedding-0.6b-s1, capmas-retrained-qwen3-embedding-0.6b-s2]

  final-adaptive:
    purpose: "attack (c) on the final test set, searched against prompted Qwen3-4B with the settings fixed on development (D-62)"
    items: data/attacks/test_adaptive_qwen3-4b.jsonl
    inputs: [full]
    methods: [qwen3-4b]

  mostargate:
    purpose: "external test: mostargate's 100 test prompts, its 15 permissions with their descriptions, graded by its own metrics; cutoffs from our development set"
    items: data/external/mostargate/test.jsonl
    glossary: data/external/mostargate/universe.json
    inputs: [full]
    seeds: [0]
    methods: *prompted

  fortis1:
    purpose: "external test: FORTIS task 1 (skill selection), its own grading code; cutoffs from our development set"
    items: data/external/fortis/task1.jsonl
    glossary: data/external/fortis/universe.json
    inputs: [full]
    seeds: [0]
    methods: *prompted

  fortis2:
    purpose: "external test: FORTIS task 2 (tool selection), its own grading code; cutoffs from our development set"
    items: data/external/fortis/task2.jsonl
    glossary: data/external/fortis/universe.json
    inputs: [full]
    seeds: [0]
    methods: *prompted

  latency:
    purpose: "RQ4 latency per call, each helper alone on exclusive GPUs, on the exact configuration reported"
    split: test
    inputs: [full]
    seeds: [0]
    methods: [capmas, capmas-scores, qwen3-reranker-0.6b, qwen3-reranker-8b, qwen3-1.7b, qwen3-4b, qwen3-8b, qwen3-30b, gpt-oss-120b]
