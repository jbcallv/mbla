# the model suite. two paradigms, each across sizes:
#   decision models: per permission, "is this permission required for the task?" -> probability
#   generative llms: read the request, output the permission set as structured json
# every served model runs alone on its own gpu(s) (orchestrate.py), so latency is measured without contention.
# serve commands run with serve/.venv-serve on PATH and HF_HOME on scratch.

methods:
  set-only: {scorer: set-only, paradigm: bound}
  manifest-only: {scorer: manifest-only, paradigm: baseline}
  lexical: {scorer: lexical, paradigm: baseline}

